name: GT7 Sport Data

# Aggiorna dati/sport.json con i dati Sport Mode dei piloti GTV:
# time trial in corso (rank mondiale + tempo) e gare settimanali, piu' lo
# storico per le sezioni "Sport" e "Sport Stats" di index.html.
#
# Gira piu' volte al giorno sui server di GitHub, quindi anche a computer spento.
# Dopo la raccolta fa push di sport.json: il push fa ripartire il deploy
# automatico di Vercel e le sezioni del sito si aggiornano da sole.
on:
  schedule:
    # Ogni voce e' separata apposta: il passo qui sotto distingue il giro
    # completo da quello leggero confrontando github.event.schedule con
    # "4 5 * * *". Con una sola voce per piu' orari quel confronto non
    # scatterebbe mai e il giro completo non partirebbe.
    #
    # Minuti "storti" apposta: alle ore piene GitHub accumula ritardi di ore
    # (osservati 3-7 h nel settembre 2026).
    #
    # Giro completo: 05:04 UTC (prima della rotazione, scarica tutto lo storico)
    - cron: "4 5 * * *"
    # Rotazione degli eventi: le time trial chiudono alle 06:59:59 UTC e i
    # nuovi eventi partono alle 07:00:00 UTC. Questo e' il giro che archivia
    # quello chiuso e mette in pagina i nuovi, pochi minuti dopo il gioco.
    - cron: "11 7 * * *"
    # Controllo post-rotazione: gt-gridstats (l'unica fonte dei nomi dei
    # circuiti) si sincronizza con i server del gioco a intervalli, quindi se
    # al giro delle 07:11 mancava ancora un nome questo lo recupera.
    - cron: "23 8 * * *"
    # Giro leggero di fine giornata
    - cron: "7 17 * * *"
  workflow_dispatch:
    # Lanciandolo a mano si puo' chiedere il giro completo (tutto lo storico),
    # che altrimenti gira solo alle 05:04 UTC.
    inputs:
      completo:
        description: "Scarica tutto lo storico dei piloti (piu' lento, ~10 min)"
        type: boolean
        default: false
  # Rigenera i dati quando cambia lo scraper: cosi' una modifica al codice
  # viene provata subito sul runner vero. Il filtro esclude sport.json, che il
  # workflow stesso committa: senza l'esclusione ogni run ne innescherebbe un
  # altro all'infinito.
  push:
    paths:
      - "sportscraping/**.py"
      - ".github/workflows/gt7-sport.yml"

permissions:
  contents: write

concurrency:
  group: gt7-sport
  cancel-in-progress: false

jobs:
  sport:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Raccogli i dati Sport Mode
        working-directory: sportscraping
        # Volutamente SENZA continue-on-error: se lo script fallisce (fonte giu'
        # o raccolta troppo parziale) il run diventa rosso e te ne accorgi.
        # In quel caso sport.json non viene toccato e il sito tiene i dati
        # precedenti, quindi non si rompe niente: ma si vede.
        #
        # Lo storico dei piloti e' paginato (10 eventi per pagina). Il giro
        # delle 05:04 scarica TUTTE le pagine (circa 10 minuti), gli altri
        # (07:11 rotazione, 08:23 controllo, 17:07 sera) solo la prima: lo
        # storico profondo resta perche' i dati nuovi vengono uniti a quelli
        # gia' salvati.
        run: |
          if [ "${{ github.event.schedule }}" = "4 5 * * *" ] || [ "${{ inputs.completo }}" = "true" ]; then
            echo "Giro completo: scarico tutto lo storico"
            python3 gt7_sport.py --full
          else
            echo "Giro leggero: aggiorno solo il periodo recente"
            python3 gt7_sport.py
          fi

      - name: Commit e push
        uses: ./.github/actions/commit-push
        with:
          percorsi: dati/sport.json
          messaggio: "chore(sport): aggiornamento dati Sport Mode GT7"
