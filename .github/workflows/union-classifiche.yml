name: Union Classifiche

# Legge classifiche generali e risultati di gara dal Portale Classifiche
# Union e aggiorna dati/union/classifiche.json (sezioni Risultati e
# Classifiche di union.html).
#
# I risultati di gara sono immagini e l'OCR usa il framework Vision di
# macOS. Le immagini gia' lette stanno in unionscraping/classifiche/
# cache.json (per ETag), quindi un runner macOS serve solo quando il
# portale pubblica un'immagine nuova: il primo job controlla su Linux e il
# secondo parte su macOS solo se serve.
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: union-classifiche
  cancel-in-progress: false

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      serve_ocr: ${{ steps.controllo.outputs.serve_ocr }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: controllo
        name: Ci sono immagini nuove da leggere?
        run: python3 unionscraping/classifiche/classifiche.py --controlla

  aggiorna:
    needs: controlla
    runs-on: ${{ needs.controlla.outputs.serve_ocr == 'true' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aggiorna classifiche e risultati
        run: python3 unionscraping/classifiche/classifiche.py

      - name: Commit e push
        uses: ./.github/actions/commit-push
        with:
          percorsi: dati/union/classifiche.json unionscraping/classifiche/cache.json
          messaggio: "chore(unionscraping): aggiornamento classifiche Union"
