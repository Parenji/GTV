name: Union Classifiche

# Legge classifiche generali e risultati di gara dal Portale Classifiche
# Union e aggiorna dati/union/classifiche.json (sezioni Risultati e
# Classifiche di union.html).
#
# Gira su macOS perche' le classifiche di gara del portale sono immagini e
# l'OCR usa il framework Vision di macOS. Le immagini gia' lette (stesso ETag)
# si riusano dal file, e i punti gara per gara si conservano da un'esecuzione
# all'altra.
on:
  schedule:
    # ogni 6 ore: il portale si aggiorna dopo le serate di gara
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  classifiche:
    runs-on: macos-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Aggiorna classifiche e risultati
        working-directory: unionscraping/classifiche
        run: python3 classifiche.py

      - name: Commit e push delle modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dati/union/classifiche.json
          if git diff --cached --quiet; then
            echo "Nessuna novita' sul portale: niente commit."
            exit 0
          fi
          git commit -m "chore(unionscraping): aggiornamento classifiche Union"
          # gli altri workflow pushano spesso: si allinea prima di pushare
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Push delle classifiche non riuscito."
          exit 1
