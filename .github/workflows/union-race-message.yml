name: Union Race Message

# Invia su Telegram il messaggio promemoria del giorno di gara, a mezzanotte
# italiana, cosi' e' gia' in chat e puoi inoltrarlo su WhatsApp quando vuoi.
#
# ATTENZIONE (lezione del 21/09/2026): i cron di GitHub Actions NON sono
# puntuali, possono partire con ore di ritardo (osservati ~1h50m). Per questo
# il job non si fida dell'orario di partenza: parte la sera, verifica che il
# giorno target sia un giorno di gara, ASPETTA la mezzanotte italiana e solo
# allora invia (--auto). Il secondo cron, la mattina, e' una rete di
# sicurezza se il primo giro non e' mai partito.
#
# Il registro unionscraping/.sent_state.json impedisce che lo stesso giorno
# venga inviato due volte.
on:
  schedule:
    # 20:00 UTC = 22:00 italiane (estate) / 21:00 (inverno): si mette in attesa
    - cron: "0 20 * * *"
    # rete di sicurezza: 05:00 UTC = 07:00 italiane (estate) / 06:00 (inverno)
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Data di gara da generare (YYYY-MM-DD). Vuoto = automatico."
        required: false

permissions:
  contents: write

# Se due esecuzioni si sovrappongono, l'ultima attende invece di duplicare.
concurrency:
  group: union-race-message
  cancel-in-progress: false

jobs:
  message:
    runs-on: ubuntu-latest
    # il job puo' restare in attesa della mezzanotte per alcune ore
    timeout-minutes: 330

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aggiorna i dati Union
        working-directory: unionscraping
        # Se lo scraping fallisce (rete/Google), si prosegue con il
        # data.json gia' presente nel repo: il messaggio parte comunque.
        continue-on-error: true
        run: python3 scraper.py

      - name: Invia il messaggio del giorno di gara
        working-directory: unionscraping
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            # lancio manuale con data esplicita: invio immediato
            echo "Eseguo: invio manuale del ${{ github.event.inputs.date }}"
            python3 whatsapp_reminder.py --date "${{ github.event.inputs.date }}" \
              --send-telegram --force
          else
            echo "Eseguo: invio automatico (--auto)"
            python3 whatsapp_reminder.py --auto
          fi

      - name: Registra l'invio nel repo
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ ! -f unionscraping/.sent_state.json ]; then
            echo "Nessun registro di invio da salvare."
            exit 0
          fi
          if git diff --quiet -- unionscraping/.sent_state.json; then
            echo "Registro invariato: niente da committare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unionscraping/.sent_state.json
          git commit -m "chore(bot): registra l'invio del messaggio di oggi"
          # lo scraper pusha ogni 12h: allineo prima di pushare
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "Registro salvato."
              exit 0
            fi
            sleep 5
          done
          echo "::warning::Non sono riuscito a salvare il registro degli invii."
          exit 0

      - name: Salva i messaggi generati come artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: messaggi-union
          path: unionscraping/whatsapp/*.txt
          if-no-files-found: ignore
          retention-days: 14
