name: Union Scraper

# Aggiorna dati/union/lobby.json (lobby e piloti della settimana) dai fogli
# Google del sito HUB Union, due volte al giorno sui server di GitHub.
# Il file si riscrive solo se i fogli sono cambiati davvero: niente commit
# (e niente deploy) per il solo orario. Se i fogli rispondono con dati
# sospetti lo scraper si ferma e il run diventa rosso.
on:
  schedule:
    # minuti "storti": alle ore piene GitHub accumula ritardi di ore
    - cron: "17 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: union-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Esegui lo scraper
        run: python3 unionscraping/scraper/scraper.py

      - name: Commit e push
        uses: ./.github/actions/commit-push
        with:
          percorsi: dati/union/lobby.json
          messaggio: "chore(unionscraping): aggiornamento automatico dati Union"
