name: Union Scraper

# Esegue automaticamente lo scraper delle lobby Union ogni 12 ore
# sui server di GitHub (cloud) → funziona anche a computer spento.
# Dopo lo scrape fa push di data.json/index.html sul branch main,
# e il push sul repo innesca il redeploy automatico di Vercel,
# così il sito live si aggiorna da solo.
on:
  schedule:
    # '0 */12 * * *'  → alle 00:00 e 12:00 UTC ogni giorno
    - cron: "0 */12 * * *"
  # Permette di lanciarlo anche manualmente dalla UI di GitHub
  workflow_dispatch:

# Il token GITHUB_TOKEN deve poter fare push del commit
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Esegui lo scraper
        working-directory: unionscraping
        run: python3 scraper.py

      - name: Commit e push delle modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unionscraping/data.json unionscraping/index.html
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati: niente commit."
            exit 0
          fi
          git commit -m "chore(unionscraping): aggiornamento automatico dati Union"
          # Il push innesca il redeploy automatico su Vercel (deploy a ogni push)
          git push
